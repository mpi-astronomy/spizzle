[project]
name = "spizzle"
authors = [
    {name = "James Davies", email = "jdavies@mpia.de"},
]
description = "Drizzle as an explicit sparse linear operator, in float64"
readme = "README.md"
license = "BSD-3-Clause"
license-files = [
    "LICENSE",
    "licenses/DRIZZLE_LICENSE.rst",  # spizzle.geometry is ported from drizzle
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
requires-python = ">=3.11"
# CI tests these lower bounds, and those of the test requirements, on the oldest Python
dependencies = [
    "numba>=0.58",  # the first numba for numpy 1.25 and Python 3.11
    "numpy>=1.25",  # as jwst 2.0
    "scipy>=1.14.1",  # as jwst 2.0
]
dynamic = ['version']

[project.optional-dependencies]
docs = [
    "sphinx",
    "sphinx-automodapi",
    "numpydoc",
]
# every test requirement has a lower bound too: the oldest-dependencies CI job installs the
# lowest version that each direct requirement allows (uv's --resolution lowest-direct)
test = [
    # the drizzle comparison tests need float64 output arrays in drizzle, not yet released;
    # CI installs jdavies-st/drizzle@float64-phase2-c-accepts-float64 over this
    "drizzle>=2.2",  # as stcal 1.18
    "astropy>=6.1",  # Covariance.write_correlation; as jwst 2.0
    "pytest>=8.0",
    "flake8>=7.0",
    "flake8-pyproject>=1.2.3",
    "pytest-cov>=5.0",
]
cff = [
    "cff-from-621",
]
jwst = [
    # benchmarks/compare_stcal.py runs jwst's own ResampleImage against spizzle
    "jwst>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/mpi-astronomy/spizzle"

[build-system]
requires = [
    "setuptools>=77",
    "setuptools_scm>=8",
    "wheel",
]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools_scm]
write_to = "src/spizzle/_version.py"

[tool.cff-from-621]
# no version or date-released: the tag and PyPI carry the version
order = ["cff-version", "message", "title", "abstract", "authors", "urls", "type", "keywords"]

[tool.cff-from-621.static]
message = "If you use this software, please cite as below."
license = "BSD-3-Clause"
authors = [
    {"family-names" = "Davies", "given-names" = "James E.", "email" = "jdavies@mpia.de", "orcid" = "https://orcid.org/0000-0002-5079-9098", "affiliation" = "Max Planck Institute for Astronomy"},
]

[tool.setuptools.dynamic]
# cff-from-621 needs this to resolve the dynamic version; setuptools_scm still sets it, with a warning
version = {attr = "spizzle._version.version"}

[tool.flake8]
max-line-length = 130
exclude = [
    'docs',
    '.tox',
    '.eggs',
    'build',
    '*_version.py',
]
