name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.python-version }}${{ matrix.resolution == 'lowest-direct' && ', oldest dependencies' || '' }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
        resolution: ["highest"]
        include:
          # the lowest version of each requirement that pyproject.toml allows, on the oldest Python
          - python-version: "3.11"
            resolution: "lowest-direct"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # setuptools_scm needs the tags for the version
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        env:
          RESOLUTION: ${{ matrix.resolution }}
        run: |
          python -m pip install --upgrade pip uv
          uv pip install --system --resolution "$RESOLUTION" ".[test]"
          # the drizzle comparison tests need float64 output arrays, not yet in a drizzle release;
          # installed without its dependencies, so that it changes no other version
          uv pip install --system --no-deps "drizzle @ git+https://github.com/jdavies-st/drizzle.git@float64-phase2-c-accepts-float64"
          uv pip list --system | grep -i -E "^(numba|numpy|scipy|astropy|drizzle|pytest|flake8) "

      - name: Lint with flake8
        run: flake8 . --count --statistics

      - name: Test with pytest
        run: pytest tests
